<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/lovable-uploads/9edc7871-f7a6-43df-a0a3-5d615c245270.png" type="image/png">

    <!--
      Sitewide fallback head.
      Per-route <title>, description, canonical, and og:* are set via
      react-helmet-async in each page component (see src/components/SEO.tsx).
      These tags act as the fallback for non-JS social-preview crawlers.
    -->
    <title>BingeGuide: Your OTT Content Tracker and Reminder</title>
    <meta name="description" content="BingeGuide helps you discover, track, and get reminders for movies and TV shows across Netflix, Prime Video, Hotstar, and more OTT platforms." />
    <meta name="author" content="BingeGuide" />

    <meta property="og:title" content="BingeGuide: Your OTT Content Tracker and Reminder" />
    <meta property="og:description" content="Discover, track, and get reminders for upcoming movies and web series across all major OTT platforms." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bingeguide-app.lovable.app/" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Sitewide Organization + WebSite JSON-LD for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "BingeGuide",
        "url": "https://bingeguide-app.lovable.app/",
        "email": "helpofbingeguide@gmail.com"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "BingeGuide",
        "url": "https://bingeguide-app.lovable.app/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://bingeguide-app.lovable.app/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
